# Local Stellar network for prism's end-to-end suite.
#
# The suite starts this itself (`make test-e2e`) and tears it down afterwards.
# To run a node by hand instead:
#
#   docker compose -f internal/cli/testdata/e2e/docker-compose.yml up -d
#   PRISM_E2E=1 go test -tags e2e ./internal/cli -run TestE2E -v
#   docker compose -f internal/cli/testdata/e2e/docker-compose.yml down -v
#
# Port 8000 serves Horizon, friendbot and /soroban/rpc from the same container,
# which is what the suite's friendbot call and prism stream both need.

services:
  quickstart:
    image: ${PRISM_E2E_IMAGE:-stellar/quickstart:testing}
    container_name: prism-e2e-quickstart
    # Standalone ("local") network with the Soroban RPC endpoint enabled.
    command: ["--local", "--enable-soroban-rpc"]
    ports:
      - "8000:8000"
    # A local network has no peers to catch up with, so the container is ready
    # as soon as the RPC answers; the suite polls for that rather than relying
    # on a healthcheck shell inside the image.
